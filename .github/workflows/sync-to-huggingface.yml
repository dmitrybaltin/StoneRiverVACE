name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: huggingface-space-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Hugging Face configuration
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ vars.HF_USERNAME }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
        run: |
          test -n "$HF_TOKEN" || (echo "Missing GitHub secret: HF_TOKEN" && exit 1)
          test -n "$HF_USERNAME" || (echo "Missing GitHub variable: HF_USERNAME" && exit 1)
          test -n "$HF_SPACE_ID" || (echo "Missing GitHub variable: HF_SPACE_ID" && exit 1)
          case "$HF_SPACE_ID" in
            */*) ;;
            *) echo "HF_SPACE_ID must look like owner/space-name"; exit 1 ;;
          esac

      - name: Push main to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ vars.HF_USERNAME }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push --force "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_ID}" HEAD:main
