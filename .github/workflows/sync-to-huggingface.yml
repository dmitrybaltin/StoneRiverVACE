name: Deploy public Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: huggingface-space-deploy
  cancel-in-progress: true

env:
  HF_SPACE_REPO: DmitryBaltin/VCExperiment

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate deployment secret
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          test -n "$HF_TOKEN" || (echo "Missing GitHub Actions secret: HF_TOKEN" && exit 1)

      - name: Build clean public runtime tree
        shell: bash
        run: |
          set -euo pipefail

          DEPLOY_DIR="$RUNNER_TEMP/hf-space"
          rm -rf "$DEPLOY_DIR"
          mkdir -p "$DEPLOY_DIR"

          # Explicit whitelist. Nothing else from the GitHub repository is copied.
          install -m 0644 app.py "$DEPLOY_DIR/app.py"
          install -m 0644 requirements.txt "$DEPLOY_DIR/requirements.txt"
          install -m 0644 .hf/README.md "$DEPLOY_DIR/README.md"

          expected="$(printf '%s\n' README.md app.py requirements.txt | sort)"
          actual="$(find "$DEPLOY_DIR" -maxdepth 1 -type f -printf '%f\n' | sort)"

          if [[ "$actual" != "$expected" ]]; then
            echo "Deployment whitelist validation failed."
            echo "Expected:"
            printf '%s\n' "$expected"
            echo "Actual:"
            printf '%s\n' "$actual"
            exit 1
          fi

          if grep -Rin --exclude-dir=.git -- "StoneRiver" "$DEPLOY_DIR"; then
            echo "Forbidden project name found in public deployment tree."
            exit 1
          fi

      - name: Create one-commit deployment repository
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          DEPLOY_DIR="$RUNNER_TEMP/hf-space"
          cd "$DEPLOY_DIR"

          git init -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- README.md app.py requirements.txt
          git commit -m "Deploy public runtime"

          git remote add hf "https://DmitryBaltin:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_REPO}"
          git push --force hf main
